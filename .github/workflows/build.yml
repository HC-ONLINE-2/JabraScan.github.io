name: Generar sitio completo (index + obras + sitemap)

on:
  push:
    branches: [ main ]   # Se ejecuta al hacer push en la rama main
  workflow_dispatch:     # Permite lanzarlo manualmente desde la interfaz de GitHub

permissions:
  contents: write        # 🔑 Permite hacer commit y push de cambios
  pages: write           # 🔑 Permite desplegar en GitHub Pages
  id-token: write        # 🔑 Necesario para la autenticación de GitHub Pages

# Evita despliegues simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout del repositorio con historial completo y submódulos privados
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Commit y push de todos los cambios generados
      - name: Commit y push cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build: actualizar index y obras"
          git pull origin main --rebase
          git push

      # Configurar GitHub Pages y empaquetar los archivos para el deploy
      # Eliminar metadatos .git para reducir el tamaño del artefacto de Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Sube la raíz del repositorio como contenido de la web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
